      - label: Legacy of Fury
        icon: https://www.poewiki.net/wiki/Special:FilePath/Legacy_of_Fury_inventory_icon.png
      - label: Doppelgänger Guise
        icon: https://www.poewiki.net/wiki/Special:FilePath/Doppelg%C3%A4nger_Guise_inventory_icon.png
    - title: Uber Maven
      badges:
      - label: Impossible Escape
        icon: https://www.poewiki.net/wiki/Special:FilePath/Impossible_Escape_inventory_icon.png
      - label: Progenesis
        icon: https://www.poewiki.net/wiki/Special:FilePath/Progenesis_inventory_icon.png
      - label: Awakened Exceptional Supports
        icon: https://www.poewiki.net/wiki/Special:FilePath/Awakened_Enlighten_Support_inventory_icon.png
      - label: Eclipse Support
        icon: https://www.poewiki.net/wiki/Special:FilePath/Eclipse_Support_inventory_icon.png
