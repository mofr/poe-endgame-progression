# Path of Exile endgame poster specification
#
# Edit this file when a new league changes progression, bosses, or rewards.
# `stages` are ordered from early progression to the final endpoint.
# Use `badges` for rewards shown as icons (label + icon URL).
# Branch/mechanic backdrops: `art` (file in assets/art), plus optional knobs:
#   artPos (CSS background-position, offset), artSize (background-size, scale),
#   artDim (0 = raw art .. 1 = default darkening), artBlend (e.g. multiply).
# `headerArt` on a mechanic replaces its header pill with a logo image.
# Keep boss-crown detail concise; put granular rewards in mechanic badges/icons.

layout:
  poster_width: 2048
  poster_min_height: 2700
  crown_columns: 11
content:
  bossCrown:
  - type: composite3
    span: 3
    color: memory
    label: Memory Threads
    art: atlas-memory.png
    artDim: 1.0
    cols:
    - label: Loneliness
      stages:
      - title: Memory of Loneliness
      - title: The Neglected Flame
      - title: Incarnation of Neglect
        badges:
        - label: Bound By Destiny
          icon: https://www.poewiki.net/wiki/Special:FilePath/Bound_By_Destiny_inventory_icon.png
        - label: Orb of Remembrance
          icon: https://www.poewiki.net/wiki/Special:FilePath/Orb_of_Remembrance_inventory_icon.png
      - title: Uber Neglect
        final: true
    - label: Trauma
      stages:
      - title: Memory of Trauma
      - title: The Cardinal of Fear
      - title: Incarnation of Fear
        badges:
        - label: Bound By Destiny
          icon: https://www.poewiki.net/wiki/Special:FilePath/Bound_By_Destiny_inventory_icon.png
        - label: Orb of Intention
          icon: https://www.poewiki.net/wiki/Special:FilePath/Orb_of_Intention_inventory_icon.png
        - label: Enmity's Embrace
          icon: https://www.poewiki.net/wiki/Special:FilePath/Enmity%27s_Embrace_inventory_icon.png
      - title: Uber Fear
        final: true
    - label: Reverence
      stages:
      - title: Memory of Reverence
      - title: The Deceitful God
      - title: Incarnation of Dread
        badges:
        - label: Bound By Destiny
          icon: https://www.poewiki.net/wiki/Special:FilePath/Bound_By_Destiny_inventory_icon.png
        - label: Orb of Unravelling
          icon: https://www.poewiki.net/wiki/Special:FilePath/Orb_of_Unravelling_inventory_icon.png
        - label: Wine of the Prophet
          icon: https://www.poewiki.net/wiki/Special:FilePath/Wine_of_the_Prophet_inventory_icon.png
        - label: Originator Voidstone
          icon: https://www.poewiki.net/wiki/Special:FilePath/Originator_Voidstone_inventory_icon.png
      - title: Uber Dread
        final: true
  - type: branch
