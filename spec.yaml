        icon: https://www.poewiki.net/wiki/Special:FilePath/Forbidden_Flame_inventory_icon.png
      - label: Annihilation's Approach
        icon: https://www.poewiki.net/wiki/Special:FilePath/Annihilation%27s_Approach_inventory_icon.png
      - label: Melding of the Flesh
        icon: https://www.poewiki.net/wiki/Special:FilePath/Melding_of_the_Flesh_inventory_icon.png
