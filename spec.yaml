# Path of Exile endgame poster specification
#
# Edit this file when a new league changes progression, bosses, or rewards.
# `stages` are ordered from early progression to the final endpoint.
# Use `badges` for rewards shown as icons (label + icon URL).
# Branch/mechanic backdrops: `art` (file in assets/art), plus optional knobs:
#   artPos (CSS background-position, offset), artSize (background-size, scale),
#   artDim (0 = raw art .. 1 = default darkening), artBlend (e.g. multiply).
# `headerArt` on a mechanic replaces its header pill with a logo image;
#   add `headerArtBlend: screen` only for exports with a baked black background;
#   `headerArtScale` scales the logo (1 = default 48px tall, 1.3 = +30%).
# Keep boss-crown detail concise; put granular rewards in mechanic badges/icons.

layout:
  poster_width: 2048
  poster_min_height: 2700
  crown_columns: 11
