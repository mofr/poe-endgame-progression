  - type: composite
    span: 2
    color: shaper
    label: Shaper / Elder
    art: shaper-elder.jpg
    artPos: calc(50% - 10px) -130px
    artSize: 110%
    leftLabel: Shaper
    rightLabel: Elder
    leftStages:
    - title: Shaper<br>Guardians
