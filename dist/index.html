<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Path of Exile — Endgame Progression Layout</title>
  <style>
    :root {
      --bg: #0a0d12;
      --bg2: #0f141c;
      --panel: rgba(18, 24, 33, 0.95);
      --panel2: rgba(13, 17, 24, 0.96);
      --line: rgba(212, 195, 154, 0.18);
      --line2: rgba(212, 195, 154, 0.10);
      --text: #ebe2d1;
      --muted: #b7ad9a;
      --gold: #c8a864;
      --c-exarch: #d96e47;
      --c-eater: #62c4e8;
      --c-maven: #b98ef7;
      --c-shaper: #7fa8ff;
      --c-elder: #8d86a8;
      --c-sirus: #ca4d4d;
      --c-memory: #52d5c7;
      --c-nightmare: #8fb5da;
      --c-synthesis: #84a9e4;
      --c-league: #b8a687;
      --c-sanctum: #d4b36a;      --c2-sanctum: #7fa3c9;
      --c-delirium: #c3c9d4;     --c2-delirium: #8a7fae;
      --c-delve: #e8a33d;        --c2-delve: #4f8fd0;
      --c-heist: #c9a54f;        --c2-heist: #7d95b5;
      --c-expedition: #8fd0dd;   --c2-expedition: #b5804f;
      --c-harvest: #5cb6e4;      --c2-harvest: #9a6fd0;
      --c-betrayal: #c47a3a;     --c2-betrayal: #5f9aa8;
      --c-incursion: #3fa08c;    --c2-incursion: #cfa84f;
      --c-bestiary: #c98a4b;     --c2-bestiary: #b04040;
      --c-abyss: #57c793;        --c2-abyss: #46618a;
      --c-beyond: #9d4f8e;       --c2-beyond: #c04545;
      --c-blight: #b5a642;       --c2-blight: #7fae5f;
      --c-breach: #8f5fd0;       --c2-breach: #9fd8e8;
      --c-legion: #e0c878;       --c2-legion: #b8c4cc;
      --c-ritual: #8e3d3d;       --c2-ritual: #5f9a8e;
      --c-ultimatum: #c03838;    --c2-ultimatum: #cfa84f;
      --c-essence: #b07fd8;      --c2-essence: #5fb6a8;
      --c-kingsmarch: #d8a94e;   --c2-kingsmarch: #6f9ec0;
    }

    @font-face {
      font-family: "Fontin";
      src: url("fonts/Fontin-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Fontin SmallCaps";
      src: url("fonts/Fontin-SmallCaps.ttf") format("truetype");
      font-weight: 400;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #06080c;
      color: var(--text);
      font-family: "Fontin SmallCaps", Georgia, "Times New Roman", serif;
    }

    body {
      min-width: calc(2048px + 32px);
      overflow-x: auto;
      display: grid;
      place-items: start center;
      padding: 16px;
    }

    .frame {
      width: 2048px;
      max-width: none;
    }


    .poster {
      position: relative;
      width: 100%;
      min-height: 2560px;
      padding: 58px 38px 28px;
      background: linear-gradient(180deg, #0b1017 0%, #0a0d12 42%, #090b10 100%);
      border: 1px solid rgba(212, 195, 154, 0.16);
      box-shadow: inset 0 0 220px rgba(0, 0, 0, 0.6), 0 30px 90px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      --backdrop-art: url("art/maven.png");
      --backdrop-blur: 6px;
      --bottom-art: url("art/delve.png");
      --bottom-blur: 6px;
    }

    /* Atmospheric texture behind everything: art layer (blurrable) + dark shade. */
    .poster-backdrop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .poster-backdrop::before {
      content: "";
      position: absolute;
      inset: -28px;
      background: var(--backdrop-art) center -160px / 115% auto no-repeat;
      filter: blur(var(--backdrop-blur, 0px));
    }
    /* Second art layer anchored to the poster floor, fading in from mid-height. */
    .poster-backdrop .bottom-art {
      position: absolute;
      inset: 0;
      background: var(--bottom-art) center bottom / 115% auto no-repeat;
      filter: blur(var(--bottom-blur, 0px));
      -webkit-mask-image: linear-gradient(180deg, transparent 50%, #fff 78%);
      mask-image: linear-gradient(180deg, transparent 50%, #fff 78%);
    }
    .poster-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 18% at 50% 3.5%, rgba(200, 168, 100, 0.10), transparent 75%),
        linear-gradient(180deg, rgba(10, 14, 20, 0.86) 0%, rgba(9, 12, 17, 0.90) 40%, rgba(8, 10, 14, 0.94) 58%, rgba(9, 12, 17, 0.84) 100%);
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(200, 168, 100, 0.08);
      pointer-events: none;
    }

    /* Corner ornaments: tapered gold rays meeting at a glowing vertex diamond. */
    .corner { position: absolute; width: 150px; height: 150px; pointer-events: none; z-index: 2; }
    .corner.tl { top: 10px; left: 10px; }
    .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner.br { bottom: 10px; right: 10px; transform: scale(-1); }
    .corner::before {
      content: ""; position: absolute; top: 0; left: 16px; width: 134px; height: 1.5px;
      background: linear-gradient(90deg, rgba(226, 205, 152, 0.85), transparent);
    }
    .corner::after {
      content: ""; position: absolute; left: 0; top: 16px; width: 1.5px; height: 134px;
      background: linear-gradient(180deg, rgba(226, 205, 152, 0.85), transparent);
    }
    .corner b {
      position: absolute; top: -3px; left: -3px; width: 8px; height: 8px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #f3e5bf, #a8853f);
      box-shadow: 0 0 10px rgba(200, 168, 100, 0.6);
    }

    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 28px;
    }
    .title-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 26px;
    }
    .title-ornament::before, .title-ornament::after {
      content: "";
      height: 1px;
      width: 280px;
      background: linear-gradient(90deg, transparent, rgba(200, 168, 100, 0.5));
    }
    .title-ornament::after {
      background: linear-gradient(270deg, transparent, rgba(200, 168, 100, 0.5));
    }
    .title-ornament span {
      width: 9px;
      height: 9px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #f3e5bf, #a8853f);
      box-shadow: 0 0 12px rgba(200, 168, 100, 0.55);
    }

    .title {
      margin: 0;
      font-size: 88px;
      line-height: 1;
      letter-spacing: 0.11em;
      text-indent: 0.11em;
      filter:
        drop-shadow(0 2px 3px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 30px rgba(200, 168, 100, 0.35));
    }
    .title span {
      background: linear-gradient(180deg, #fdf9ec 12%, #ecd9a4 55%, #b28f4e 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      margin: 14px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: 20px;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      color: #c9ae74;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
    .subtitle::before, .subtitle::after {
      content: "";
      height: 1px;
      width: 180px;
      background: linear-gradient(90deg, transparent, rgba(200, 168, 100, 0.55));
    }
    .subtitle::after {
      background: linear-gradient(270deg, transparent, rgba(200, 168, 100, 0.55));
    }

    .version {
      margin-top: 14px;
      font-size: 15px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: rgba(200, 168, 100, 0.72);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .section-title {
      margin: 0 0 26px;
      font-size: 24px;
      letter-spacing: 0.12em;
      color: #ebdfbf;
      text-align: center;
    }
    .boss-section { position: relative; z-index: 1; }
    .boss-crown {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 14px;
      margin-top: 48px;
      margin-bottom: 22px;
    }

    .boss-col, .boss-wide {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 460px;
      padding: 12px 8px 10px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(18, 24, 33, 0.78), rgba(11, 15, 21, 0.78));
      border: 1px solid rgba(212, 195, 154, 0.10);
    }
    /* Texture knobs (per entry in spec.yaml): artPos → offset, artSize → scale,
       artDim → overlay opacity multiplier (0 = raw art, 1 = default), artBlend → blend mode. */
    .boss-col.has-art, .boss-wide.has-art, .mech-card.has-art {
      background:
        linear-gradient(180deg,
          rgba(7, 13, 19, calc(0.06 * var(--art-dim, 1))) 0%,
          rgba(7, 13, 19, calc(0.38 * var(--art-dim, 1))) 55%,
          rgba(8, 14, 20, calc(0.82 * var(--art-dim, 1))) 82%),
        var(--art) var(--art-pos, center top) / var(--art-size, cover) no-repeat,
        linear-gradient(180deg, color-mix(in srgb, currentColor 25%, #1a232c), #0d1319);
      background-blend-mode: normal, var(--art-blend, normal), normal;
      border-color: color-mix(in srgb, currentColor 26%, transparent);
      box-shadow: inset 0 0 34px rgba(4, 8, 12, 0.45), 0 0 22px color-mix(in srgb, currentColor 10%, transparent);
    }

    .span-1 { grid-column: span 1; }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }

    /* Column title bar seated at the top of the panel; negative margins pull it
       out to the panel edges, so its radius must match the panel's minus the border. */
    .branch-tag {
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(100% + 16px);
      min-height: 40px;
      margin: -12px -8px 12px;
      padding: 6px 10px;
      border-bottom: 1px solid color-mix(in srgb, currentColor 55%, transparent);
      border-radius: 17px 17px 0 0;
      /* opaque, so the card art can start at any offset without showing a seam through the bar */
      background: linear-gradient(180deg, #080b10, #05070a);
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      color: inherit;
      filter:
        drop-shadow(0 1px 2px rgba(0, 0, 0, 1))
        drop-shadow(0 0 8px rgba(0, 0, 0, 0.9));
    }
    .branch-tag span {
      background: linear-gradient(180deg,
        color-mix(in srgb, currentColor 50%, #ffffff) 10%,
        color-mix(in srgb, currentColor 95%, #ffffff) 85%);
      -webkit-background-clip: text;
      background-clip: text;
      /* keeps `color` (and thus currentColor above) intact, unlike color: transparent */
      -webkit-text-fill-color: transparent;
    }

    .chain {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    /* Invisible spacer that grows to fill the gap between two stages. */
    .chain-sep {
      flex: 1 1 14px;
      min-height: 14px;
    }

    .node {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 12px;
      min-height: 58px;
    }

    .node-title {
      font-size: 19px;
      line-height: 1.14;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-align: center;
      filter:
        drop-shadow(0 1px 2px rgba(0, 0, 0, 1))
        drop-shadow(0 0 5px rgba(0, 0, 0, 0.95))
        drop-shadow(0 0 10px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 18px rgba(0, 0, 0, 0.8));
    }
    /* Inline span + box-decoration-break: clone restarts the gradient on every line. */
    .node-title span, .segment-title span {
      background: linear-gradient(180deg, #ffffff 15%, #ecd9a4 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .boss-col .node-title, .boss-wide .node-title { font-size: 16px; }
    .node-sub {
      margin-top: 4px;
      color: #cac0ad;
      font: 13px/1.22 "Fontin", system-ui, sans-serif;
      text-align: center;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.95),
        0 0 6px rgba(0, 0, 0, 0.9),
        0 0 10px rgba(0, 0, 0, 0.85);
    }
    .small-list {
      margin: 6px 0 0;
      padding: 0;
      list-style: none;
      color: #cabfae;
      font: 12px/1.22 "Fontin", system-ui, sans-serif;
      text-align: center;
    }
    .small-list li + li { margin-top: 2px; }
    .boss-col > .chain {
      flex: 1;
      justify-content: space-between;
    }
    .pair-grid > div, .tri-grid > div {
      display: flex;
      flex-direction: column;
    }
    .tri-grid .chain {
      flex: 1;
      justify-content: space-between;
    }
    .boss-section .small-list { display: none; }


    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin-top: 7px;
    }
    /* Crown columns are narrow: let the icon row bleed into the node padding so four
       square icons (e.g. the Conqueror symbols) stay on one line instead of wrapping. */
    .boss-col .badges, .boss-wide .badges {
      margin-left: -11px;
      margin-right: -11px;
    }
    .badge-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .badge-icon img {
      height: 30px;
      max-width: 42px;
      object-fit: contain;
      filter:
        drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95))
        drop-shadow(0 0 10px rgba(0, 0, 0, 0.85));
    }
    .badge-icon:hover::after {
      content: attr(data-label);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 9px 4px;
      border-radius: 7px;
      border: 1px solid rgba(212, 195, 154, 0.4);
      background: rgba(8, 11, 16, 0.96);
      color: #f0e6d2;
      font: 12px/1.3 "Fontin", system-ui, sans-serif;
      white-space: nowrap;
      z-index: 5;
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 19px;
      padding: 1px 7px 2px;
      border-radius: 999px;
      border: 1px solid rgba(218, 198, 140, 0.7);
      background: rgba(67, 52, 19, 0.4);
      color: #f0dd9e;
      font: 700 11px/1 "Fontin", system-ui, sans-serif;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .color-synthesis { color: var(--c-synthesis); }
    .color-exarch { color: var(--c-exarch); }
    .color-shaper { color: var(--c-shaper); }
    .color-elder { color: var(--c-elder); }
    .color-maven { color: var(--c-maven); }
    .color-sirus { color: var(--c-sirus); }
    .color-eater { color: var(--c-eater); }
    .color-memory { color: var(--c-memory); }
    .color-nightmare { color: var(--c-nightmare); }
    .color-league { color: var(--c-league); }
    .color-sanctum { color: var(--c-sanctum); --c2: var(--c2-sanctum); }
    .color-delirium { color: var(--c-delirium); --c2: var(--c2-delirium); }
    .color-delve { color: var(--c-delve); --c2: var(--c2-delve); }
    .color-heist { color: var(--c-heist); --c2: var(--c2-heist); }
    .color-expedition { color: var(--c-expedition); --c2: var(--c2-expedition); }
    .color-harvest { color: var(--c-harvest); --c2: var(--c2-harvest); }
    .color-betrayal { color: var(--c-betrayal); --c2: var(--c2-betrayal); }
    .color-incursion { color: var(--c-incursion); --c2: var(--c2-incursion); }
    .color-bestiary { color: var(--c-bestiary); --c2: var(--c2-bestiary); }
    .color-abyss { color: var(--c-abyss); --c2: var(--c2-abyss); }
    .color-beyond { color: var(--c-beyond); --c2: var(--c2-beyond); }
    .color-blight { color: var(--c-blight); --c2: var(--c2-blight); }
    .color-breach { color: var(--c-breach); --c2: var(--c2-breach); }
    .color-legion { color: var(--c-legion); --c2: var(--c2-legion); }
    .color-ritual { color: var(--c-ritual); --c2: var(--c2-ritual); }
    .color-ultimatum { color: var(--c-ultimatum); --c2: var(--c2-ultimatum); }
    .color-essence { color: var(--c-essence); --c2: var(--c2-essence); }
    .color-kingsmarch { color: var(--c-kingsmarch); --c2: var(--c2-kingsmarch); }

    .pair-grid {
      /* basis auto: keep content height, share only leftover space (2 gaps : 1 gap) */
      flex: 2 1 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .pair-grid .chain {
      flex: 1;
      justify-content: space-between;
    }
    .merge-box {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
    }
    .merge-box .chain {
      flex: 1;
      justify-content: space-between;
    }
    .merge-box .chain > .node:only-child {
      margin-top: auto;
    }

    .tri-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mechanics-section { position: relative; z-index: 1; margin-top: 28px; }
    .mechanics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .mech-card {
      display: flex;
      flex-direction: column;
      padding: 12px 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(212, 195, 154, 0.12);
      background: linear-gradient(180deg, rgba(17, 23, 31, 0.92), rgba(12, 16, 22, 0.92));
      min-height: 204px;
    }
    .mech-card .segment-chain {
      flex: 1;
      justify-content: space-between;
    }
    /* Wide mechanic card (span > 1) split into parallel labelled chains. */
    .mech-cols {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--mech-cols, 3), minmax(0, 1fr));
      gap: 14px;
    }
    .mech-col { display: flex; flex-direction: column; }
    .mech-col-label {
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid color-mix(in srgb, currentColor 30%, transparent);
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: color-mix(in srgb, currentColor 65%, #f0e7d2);
    }

    .mech-head {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      margin-bottom: 12px;
      border-radius: 999px;
      border: 1px solid var(--c2, currentColor);
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--c2, currentColor) 16%, rgb(5, 8, 12)),
        rgba(5, 8, 12, 0.55));
      color: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .mech-head.has-header-art {
      border: none;
      background: none;
      min-height: 48px;
      padding: 0;
    }
    .mech-head img {
      height: calc(48px * var(--header-art-scale, 1));
      max-width: 100%;
      object-fit: contain;
    }

    .segment-chain {
      display: flex;
      flex-direction: column;
    }

    .segment {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 10px;
      min-height: 42px;
      text-align: center;
    }
    .segment-title {
      font-size: 15px;
      line-height: 1.14;
      font-weight: 400;
      letter-spacing: 0.05em;
      filter:
        drop-shadow(0 1px 2px rgba(0, 0, 0, 1))
        drop-shadow(0 0 5px rgba(0, 0, 0, 0.95))
        drop-shadow(0 0 10px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 18px rgba(0, 0, 0, 0.8));
    }
    .segment-sub {
      margin-top: 3px;
      color: #c7bcaa;
      font: 12px/1.22 "Fontin", system-ui, sans-serif;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.95),
        0 0 6px rgba(0, 0, 0, 0.9),
        0 0 10px rgba(0, 0, 0, 0.85);
    }

  </style>
</head>
<body>
  <div class="frame">
    <div class="poster">
      <div class="poster-backdrop"><div class="bottom-art"></div></div>
      <div class="corner tl"><b></b></div>
      <div class="corner tr"><b></b></div>
      <div class="corner bl"><b></b></div>
      <div class="corner br"><b></b></div>
      <header class="header">
        <div class="title-ornament"><span></span></div>
        <h1 class="title"><span>Path of Exile</span></h1>
        <div class="subtitle">Endgame Progression</div>
        <div class="version">Version 3.28</div>
      </header>

      <section class="boss-section">
        <div id="bossCrown" class="boss-crown"></div>
      </section>

      <section class="mechanics-section">

    const bossCrown = document.getElementById('bossCrown');
    const mechanicsGrid = document.getElementById('mechanicsGrid');

    function makeNode(stage, cls = 'node') {
      const div = document.createElement('div');
      div.className = cls;
      div.innerHTML = `<div class="${cls === 'segment' ? 'segment-title' : 'node-title'}"><span>${stage.title}</span></div>`;
      if (stage.sub) {
        const sub = document.createElement('div');
        sub.className = cls === 'segment' ? 'segment-sub' : 'node-sub';
        sub.textContent = stage.sub;
        div.appendChild(sub);
      }
      if (stage.list) {
        const ul = document.createElement('ul');
        ul.className = 'small-list';
        stage.list.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          ul.appendChild(li);
        });
        div.appendChild(ul);
      }
      if (stage.badges) {
        const badges = document.createElement('div');
        badges.className = 'badges';
        stage.badges.forEach(item => {
          const label = typeof item === 'object' ? item.label : item;
          if (typeof item === 'object' && item.icon) {
            const wrap = document.createElement('span');
            wrap.className = 'badge-icon';
            wrap.dataset.label = label;
            const img = document.createElement('img');
            img.src = item.icon;
            img.alt = label;
            wrap.appendChild(img);
            badges.appendChild(wrap);
          } else {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = label;
            badges.appendChild(badge);
          }
        });
        div.appendChild(badges);
      }
      return div;
    }

    function applyArt(el, item) {
      if (!item.art) return;
      el.classList.add('has-art');
      el.style.setProperty('--art', `url("art/${item.art}")`);
      if (item.artPos) el.style.setProperty('--art-pos', item.artPos);
      if (item.artSize) el.style.setProperty('--art-size', item.artSize);
      if (item.artDim !== undefined) el.style.setProperty('--art-dim', item.artDim);
      if (item.artBlend) el.style.setProperty('--art-blend', item.artBlend);
    }

    function makeBranchTag(text, colorClass) {
      const tag = document.createElement('div');
      tag.className = `branch-tag color-${colorClass}`;
      const span = document.createElement('span');
      span.textContent = text;
      tag.appendChild(span);
      return tag;
    }

    function makeChain(stages, nodeClass = 'node') {
      const chain = document.createElement('div');
      chain.className = nodeClass === 'segment' ? 'segment-chain' : 'chain';
      stages.forEach((stage, i) => {
        if (i > 0) {
          const sep = document.createElement('div');
          sep.className = 'chain-sep';
          chain.appendChild(sep);
        }
        chain.appendChild(makeNode(stage, nodeClass));
      });
      return chain;
    }

    DATA.bossCrown.forEach(branch => {
      const wrap = document.createElement('div');
      wrap.className = `${branch.type === 'branch' ? 'boss-col' : 'boss-wide'} span-${branch.span || 1} color-${branch.color}`;
      applyArt(wrap, branch);
      wrap.appendChild(makeBranchTag(branch.label, branch.color));

      if (branch.type === 'branch') {
        wrap.appendChild(makeChain(branch.stages));
      }

      if (branch.type === 'composite') {
        const pair = document.createElement('div');
        pair.className = 'pair-grid';

        const left = document.createElement('div');
        left.appendChild(makeChain(branch.leftStages));

        const right = document.createElement('div');
        right.className = 'color-elder';
        right.appendChild(makeChain(branch.rightStages));

        pair.appendChild(left);
        pair.appendChild(right);
        wrap.appendChild(pair);

        const merge = document.createElement('div');
        merge.className = 'merge-box';
        merge.appendChild(makeChain(branch.mergeStages));
        wrap.appendChild(merge);
      }

      if (branch.type === 'composite3') {
        if (branch.entry) wrap.appendChild(makeChain([branch.entry]));
        const tri = document.createElement('div');
        tri.className = 'tri-grid';
        branch.cols.forEach(col => {
          const colDiv = document.createElement('div');
          colDiv.appendChild(makeChain(col.stages));
          tri.appendChild(colDiv);
        });
        wrap.appendChild(tri);
      }

      bossCrown.appendChild(wrap);
    });

    DATA.mechanics.forEach(mech => {
      const card = document.createElement('div');
      card.className = `mech-card span-${mech.span || 1} color-${mech.color || 'league'}`;
      applyArt(card, mech);
      const head = document.createElement('div');
      head.className = 'mech-head';
      if (mech.headerArt) {
        head.classList.add('has-header-art');
        const img = document.createElement('img');
        img.src = `art/${mech.headerArt}`;
        img.alt = mech.label;
        if (mech.headerArtBlend) img.style.mixBlendMode = mech.headerArtBlend;
        if (mech.headerArtScale) head.style.setProperty('--header-art-scale', mech.headerArtScale);
        head.appendChild(img);
      } else {
        head.textContent = mech.label;
      }
      card.appendChild(head);
      if (mech.cols) {
        const cols = document.createElement('div');
        cols.className = 'mech-cols';
        cols.style.setProperty('--mech-cols', mech.cols.length);
        mech.cols.forEach(col => {
          const colDiv = document.createElement('div');
          colDiv.className = 'mech-col';
          const label = document.createElement('div');
          label.className = 'mech-col-label';
          label.textContent = col.label;
          colDiv.appendChild(label);
          colDiv.appendChild(makeChain(col.stages, 'segment'));
          cols.appendChild(colDiv);
        });
        card.appendChild(cols);
      } else {
        card.appendChild(makeChain(mech.stages, 'segment'));
      }
      mechanicsGrid.appendChild(card);
    });
  </script>
